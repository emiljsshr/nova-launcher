// Ab 26.1 ist Minecraft nicht mehr verschleiert: kein Remapping, keine Mappings, Mojangs Klassennamen
plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

apply from: "../../common.gradle"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Nur das Ressourcen-Modul der Fabric API (lädt Sprachdateien der Mod) – wird in die JAR eingebettet
    ["fabric-api-base", "fabric-resource-loader-v1"].each { name ->
        def module = fabricApi.module(name, project.fabric_version)
        implementation module
        include module
    }
}
